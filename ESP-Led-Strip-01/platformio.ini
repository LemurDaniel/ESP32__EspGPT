; NOTE:
;   WS2812 LED strip (144 LEDs) on the Waveshare ESP32-C6-Touch-LCD-1.47
;   (172x320 JD9853 display, AXS5106L touch). Display and touch are not driven yet.
;   Requires: PlatformIO, the pioarduino platform (Arduino core 3.x, the only one supporting the C6).
;   On Windows: long paths enabled, and build from PowerShell (the ESP-IDF tool installer refuses Git Bash).
;
;   pio run -e waveshare-c6-touch-lcd147                     Build
;   pio run -e waveshare-c6-touch-lcd147 --target upload     Flash over USB-C
;   pio device monitor --baud 115200                         Serial monitor

[env]
; Official espressif32 has no Arduino core 3 / ESP32-C6 support, pioarduino is the community fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

lib_deps =
    fastled/FastLED@^3.9.16
    ; The Waveshare demo ships 1.5.9, which does not compile against this Arduino core
    ; (spiFrequencyToClockDiv changed its signature).
    moononournation/GFX Library for Arduino@^1.6.0

; The dependency finder pulls the core's SD library in through FastLED, it does not
; build on the C6 (ff.h missing) and is unused.
lib_ignore =
    SD

; ---------------------------------------------------------------------------
; Waveshare ESP32-C6-Touch-LCD-1.47
;   Pin numbers per docs.waveshare.com/ESP32-C6-Touch-LCD-1.47 (Pinout Definition).
;   Taken by the board: 1, 2 (LCD + TF SPI), 3, 4 (TF), 14, 15, 22, 23 (LCD),
;   18, 19, 20, 21 (touch + IMU I2C), 5, 6 (IMU INT), 8 (BOOT), 0 (battery ADC),
;   12, 13 (USB), 16, 17 (UART0). Free on the header: 7.
; ---------------------------------------------------------------------------
[env:waveshare-c6-touch-lcd147]
board = esp32-c6-devkitc-1
; The board carries an ESP32-C6FH8 with 8 MB in-package flash.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    ; Serial over the native USB-C port (USB-Serial-JTAG)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; JD9853 display, 172x320 on SPI. The TF card shares SCLK / MOSI, its CS is held high.
    -D LCD_SCLK=1
    -D LCD_MOSI=2
    -D LCD_CS=14
    -D LCD_DC=15
    -D LCD_RST=22
    -D LCD_BL=23
    -D SD_CS=4
    ; AXS5106L touch on I2C (shared with the QMI8658 IMU)
    -D TOUCH_SDA=18
    -D TOUCH_SCL=19
    -D TOUCH_RST=20
    -D TOUCH_INT=21
    ; BTF-LIGHTING WS2812 ECO, 1 m, 144 LEDs, GRB. DIN via 330 Ohm on header pin 7,
    ; the only header GPIO without an onboard peripheral.
    -D LED_DATA_PIN=7
    -D LED_COUNT=144
    -D LED_BRIGHTNESS=80
    ; Strip fed from VBUS (USB). FastLED scales the frame down to stay inside this budget.
    ; Raise only with an external 5 V supply (full white is ~8.6 A).
    -D LED_MAX_MILLIAMPS=500
