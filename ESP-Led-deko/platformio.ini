; NOTE:
;   Candle flame LED decoration on the Waveshare ESP32-C6 1.47" display board
;   (172x320 ST7789, onboard WS2812, BOOT button). No WiFi, no web server.
;   Requires: PlatformIO, the pioarduino platform (Arduino core 3.x, the only one supporting the C6).
;   On Windows: long paths enabled, and build from PowerShell (the ESP-IDF tool installer refuses Git Bash).
;
;   pio run -e waveshare-c6-lcd147                     Build
;   pio run -e waveshare-c6-lcd147 --target upload     Flash over USB-C
;   pio device monitor --baud 115200                   Serial monitor

[env]
; Official espressif32 has no Arduino core 3 / ESP32-C6 support, pioarduino is the community fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200

lib_deps =
    fastled/FastLED@^3.9.16
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0

; Pulled in by the Adafruit display library for its examples only. The registry SD
; does not support ESP32 and breaks the build, seesaw is unused.
lib_ignore =
    SD
    Adafruit seesaw Library

; ---------------------------------------------------------------------------
; Waveshare ESP32-C6-LCD-1.47
;   Pin numbers per the Waveshare wiki and the header silkscreen.
; ---------------------------------------------------------------------------
[env:waveshare-c6-lcd147]
board = esp32-c6-devkitc-1
; The board carries an ESP32-C6FH8 with 8 MB in-package flash.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    ; Serial over the native USB-C port (USB-Serial-JTAG)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; ST7789 display, 172x320 on SPI
    -D LCD_MOSI=6
    -D LCD_SCLK=7
    -D LCD_CS=14
    -D LCD_DC=15
    -D LCD_RST=21
    -D LCD_BL=22
    ; Onboard RGB LED (WS2812-type, single pixel)
    -D ONBOARD_LED_PIN=8
    ; BOOT button, strapping pin but safe as input after boot
    -D BOOT_BUTTON_PIN=9
    ; Freenove 8 RGB LED module (WS2812B), IN-S on header pin 2
    -D LED_DATA_PIN=2
    -D LED_COUNT=8
    -D LED_BRIGHTNESS=255
    ; USB powered. The flame (no blue) peaks at ~260 mA for 8 LEDs, the limit is only a safety net.
    -D LED_MAX_MILLIAMPS=500
