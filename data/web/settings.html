<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #11141a;
            color: #e3e6eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .settings-container {
            width: 100%;
            max-width: 480px;
            background: #181c24;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #232936;
            overflow: hidden;
        }

        .settings-header {
            background-color: #1c212c;
            color: #ffffff;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #232936;
            letter-spacing: 0.5px;
        }

        .settings-body {
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #79869c;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 13px 16px;
            background-color: #13171f;
            border: 1px solid #2c3545;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #0070f3;
            box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
        }

        input::placeholder {
            color: #52627a;
        }

        .settings-footer {
            padding: 18px 24px;
            border-top: 1px solid #232936;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 13px 24px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0051b3;
            box-shadow: 0 0 12px rgba(0, 112, 243, 0.3);
        }

        .status {
            font-size: 0.88rem;
            color: #79869c;
            flex: 1;
            text-align: right;
        }

        .status.ok {
            color: #3ecf8e;
        }

        .status.err {
            color: #e05c5c;
        }
    </style>
</head>

<body>

    <div class="settings-container">
        <div class="settings-header">GPT Settings</div>
        <div class="settings-body">
            <div class="field">
                <label>Base URL</label>
                <input type="text" id="baseUrl" placeholder="https://your-resource.cognitiveservices.azure.com">
            </div>
            <div class="field">
                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="••••••••••••••••">
            </div>
            <div class="field">
                <label>Model</label>
                <input type="text" id="model" placeholder="gpt-4o">
            </div>
            <div class="field">
                <label>System Prompt</label>
                <input type="text" id="systemPrompt" placeholder="gpt-4o">
            </div>
        </div>

        <div class="settings-header">Github Settings</div>
        <div class="settings-body">
            <div class="field">
                <label>API Key</label>
                <input type="text" id="githubUser" placeholder="••••••••••••••••">
            </div>
            <div class="field">
                <label>API Key</label>
                <input type="password" id="githubToken" placeholder="••••••••••••••••">
            </div>
        </div>
        <div class="settings-footer">
            <button onclick="saveSettings()">Speichern</button>
            <span class="status" id="status"></span>
        </div>
    </div>

    <script>
        window.onload = async function () {

            const statusEl = document.getElementById('status');

            try {
                const res = await fetch('/admin/settings/gpt', {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' }
                });

                if (!res.ok) throw new Error(res.status);

                const settings = await res.json();

                document.getElementById('baseUrl').value = settings.baseUrl
                document.getElementById('apiKey').value = settings.apiKey
                document.getElementById('model').value = settings.model
                document.getElementById('systemPrompt').value = settings.systemPrompt
                document.getElementById('githubUser').value = settings.githubUser
                document.getElementById('githubToken').value = settings.githubToken
            } catch (e) {
                statusEl.textContent = 'Fehler beim Speichern';
                statusEl.className = 'status err';
            }

            setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'status'; }, 3000);
        }

        async function saveSettings() {
            const payload = {
                baseUrl: document.getElementById('baseUrl').value.trim(),
                apiKey: document.getElementById('apiKey').value.trim(),
                model: document.getElementById('model').value.trim(),
                systemPrompt: document.getElementById('systemPrompt').value.trim(),
                githubUser: document.getElementById('githubUser').value.trim(),
                githubToken: document.getElementById('githubToken').value.trim()
            };

            const statusEl = document.getElementById('status');

            try {
                const res = await fetch('/admin/settings/gpt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error(res.status);

                statusEl.textContent = 'Gespeichert';
                statusEl.className = 'status ok';
            } catch (e) {
                statusEl.textContent = 'Fehler beim Speichern';
                statusEl.className = 'status err';
            }

            setTimeout(() => { statusEl.textContent = ''; statusEl.className = 'status'; }, 3000);
        }
    </script>

</body>

</html>
