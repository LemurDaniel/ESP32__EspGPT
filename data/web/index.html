<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Dark Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #11141a;
            color: #e3e6eb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 85vh;
            background: #181c24;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #232936;
        }

        .chat-header {
            background-color: #1c212c;
            color: #ffffff;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            border-bottom: 1px solid #232936;
            letter-spacing: 0.5px;
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background-color: #13171f;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Scrollbar Styling */
        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: #13171f;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #2c3545;
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .user {
            background-color: #0070f3;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background-color: #232936;
            color: #e3e6eb;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2d3545;
        }

        .system-msg {
            color: #79869c;
            font-style: italic;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .input-area {
            padding: 18px;
            background: #181c24;
            border-top: 1px solid #232936;
            display: flex;
            gap: 12px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            background-color: #13171f;
            border: 1px solid #2c3545;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #0070f3;
            box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
        }

        input[type="text"]::placeholder {
            color: #52627a;
        }

        button {
            padding: 14px 24px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #0051b3;
            box-shadow: 0 0 12px rgba(0, 112, 243, 0.3);
        }

        button:disabled {
            background-color: #232936;
            color: #52627a;
            border: 1px solid #2c3545;
            cursor: not-allowed;
            box-shadow: none;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <div class="chat-header">AI Chat Assistant</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot">Bereit. Schreibe eine Nachricht, um den Endpunkt anzusprechen.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Nachricht senden..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script>
        const messageDivs = [];
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Activate on Enter-Key.
        userInput.addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        class Message {

            _messageDiv = null;
            constructor(text, classList) {
                this._messageDiv = document.createElement('div');

                const messageDiv = this._messageDiv;
                chatBox.appendChild(messageDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                messageDiv.innerHTML = text;
                messageDivs.push(messageDiv);

                this.add('message');
                
                if (null != classList) {
                    for (const item of classList.split(' ')) {
                        this.add(item);
                    }
                }
            }

            toggle(className) {
                this._messageDiv.classList.add(className)
            }

            remove(className) {
                this._messageDiv.classList.remove(className);
            }

            add(className) {
                this._messageDiv.classList.add(className);
            }

            set(text) {
                this._messageDiv.innerHTML = text;
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. User-Nachricht anzeigen
            const userMessage = new Message(text, 'user');
            userInput.value = '';

            // UI sperren
            userInput.disabled = true;
            sendBtn.disabled = true;

            // 2. Lade-Indikator anzeigen
            const botMessage = new Message('Denke nach...', 'bot system-msg');

            try {
                // 3. POST-Request an /chat
                const response = await fetch('/gpt/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ msg: text })
                });

                if (!response.ok) throw new Error();

                const reply = await response.text();

                // 4. Antwort einfügen
                botMessage.set(reply);
                botMessage.remove('system-msg');

            } catch (error) {
                botMessage.set('Error');
                botMessage.remove('system-msg');
            } finally {
                // UI wieder freigeben
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

    </script>

</body>

</html>
