; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/LemurDaniel-Solutions/ESP32__MiniWebServer-Framework
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

board_build.filesystem = littlefs

[env:ESP32-S3]
board = esp32-s3-devkitc-1

; ESP32 dev board with built-in 2.8" ILI9341 320x240 touch TFT
; (e.g. "Cheap Yellow Display" ESP32-2432S028R) - plain ESP32-WROOM-32 module
[env:ESP32-2432S028]
platform = espressif32
board = esp32dev

lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI

build_flags =
    -D BOARD_CYD_2432S028=1
    ; external I2C header pins (GPIO21 is used for the TFT backlight on this board)
    -D CYD_I2C_SDA=27
    -D CYD_I2C_SCL=22
    ; TFT_eSPI config for the built-in ILI9341 (no User_Setup.h needed)
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1