<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensor Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #11141a;
            color: #e3e6eb;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 32px 16px;
        }

        header {
            width: 100%;
            max-width: 800px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            color: #79869c;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2c3545;
            transition: background 0.3s;
        }

        .dot.active { background: #22c55e; }
        .dot.error  { background: #ef4444; }

        /* Cards */
        .cards {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .card {
            background: #181c24;
            border: 1px solid #232936;
            border-radius: 16px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-label {
            font-size: 0.78rem;
            color: #79869c;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .card-value {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1;
        }

        .card-unit {
            font-size: 1rem;
            font-weight: 400;
            color: #79869c;
        }

        .card-temp  .card-value { color: #f97316; }
        .card-hum   .card-value { color: #38bdf8; }
        .card-pres  .card-value { color: #a78bfa; }

        /* History table */
        .history-wrap {
            width: 100%;
            max-width: 800px;
        }

        .history-wrap h2 {
            font-size: 0.9rem;
            font-weight: 600;
            color: #79869c;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #1e2430;
        }

        th {
            color: #52627a;
            font-weight: 500;
        }

        td { color: #c8cfd9; }

        tr:last-child td { border-bottom: none; }

        /* Controls */
        .controls {
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .controls label {
            font-size: 0.82rem;
            color: #79869c;
        }

        select {
            background: #181c24;
            border: 1px solid #2c3545;
            border-radius: 8px;
            color: #e3e6eb;
            padding: 7px 12px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        button {
            padding: 8px 18px;
            background-color: #0070f3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #0051b3; }

        .last-update {
            font-size: 0.78rem;
            color: #52627a;
            margin-left: auto;
        }
    </style>
</head>

<body>

    <header>
        <h1>Sensor Dashboard</h1>
        <div class="status">
            <div class="dot" id="dot"></div>
            <span id="statusText">Verbinde…</span>
        </div>
    </header>

    <div class="controls">
        <label>Intervall:</label>
        <select id="intervalSelect">
            <option value="2000">2 s</option>
            <option value="5000" selected>5 s</option>
            <option value="10000">10 s</option>
            <option value="30000">30 s</option>
            <option value="60000">60 s</option>
        </select>
        <button onclick="fetchNow()">Jetzt lesen</button>
        <span class="last-update" id="lastUpdate">–</span>
    </div>

    <div class="cards">
        <div class="card card-temp">
            <div class="card-label">Temperatur</div>
            <div class="card-value" id="temp">–<span class="card-unit"> °C</span></div>
        </div>
        <div class="card card-hum">
            <div class="card-label">Luftfeuchtigkeit</div>
            <div class="card-value" id="hum">–<span class="card-unit"> %</span></div>
        </div>
        <div class="card card-pres">
            <div class="card-label">Luftdruck</div>
            <div class="card-value" id="pres">–<span class="card-unit"> hPa</span></div>
        </div>
    </div>

    <div class="history-wrap">
        <h2>Verlauf</h2>
        <table>
            <thead>
                <tr>
                    <th>Zeit</th>
                    <th>Temp (°C)</th>
                    <th>Feuchte (%)</th>
                    <th>Druck (hPa)</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>
    </div>

    <script>
        const MAX_HISTORY = 50;
        const history = [];

        let intervalId = null;

        function fmt(val, decimals = 1) {
            return val == null ? '–' : Number(val).toFixed(decimals);
        }

        function timeStr() {
            return new Date().toLocaleTimeString('de-DE');
        }

        function setStatus(ok) {
            const dot = document.getElementById('dot');
            const txt = document.getElementById('statusText');
            dot.className = 'dot ' + (ok ? 'active' : 'error');
            txt.textContent = ok ? 'Verbunden' : 'Fehler';
        }

        function updateCards(data) {
            document.getElementById('temp').innerHTML = fmt(data.temperature) + '<span class="card-unit"> °C</span>';
            document.getElementById('hum').innerHTML  = fmt(data.humidity)    + '<span class="card-unit"> %</span>';
            document.getElementById('pres').innerHTML = fmt(data.pressure, 1) + '<span class="card-unit"> hPa</span>';
            document.getElementById('lastUpdate').textContent = 'Letzte Messung: ' + timeStr();
        }

        function addHistoryRow(data) {
            history.unshift({ time: timeStr(), ...data });
            if (history.length > MAX_HISTORY) history.pop();

            const tbody = document.getElementById('historyBody');
            tbody.innerHTML = history.map(r =>
                `<tr>
                    <td>${r.time}</td>
                    <td>${fmt(r.temperature)}</td>
                    <td>${fmt(r.humidity)}</td>
                    <td>${fmt(r.pressure, 1)}</td>
                </tr>`
            ).join('');
        }

        async function fetchNow() {
            try {
                const res = await fetch('/sensor');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                setStatus(true);
                updateCards(data);
                addHistoryRow(data);
            } catch (e) {
                console.error(e);
                setStatus(false);
            }
        }

        function startInterval() {
            if (intervalId) clearInterval(intervalId);
            const ms = parseInt(document.getElementById('intervalSelect').value, 10);
            intervalId = setInterval(fetchNow, ms);
        }

        document.getElementById('intervalSelect').addEventListener('change', startInterval);

        fetchNow();
        startInterval();
    </script>

</body>

</html>
